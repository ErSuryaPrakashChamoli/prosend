openapi: 3.1.0
info:
  title: ProSend API
  version: "1.0.0"
  description: |
    Send transactional email through ProSend and read its delivery status, without handling SMTP credentials.

    Authenticate with an API key created by an administrator under Infrastructure > API keys:
    `Authorization: Bearer psk_live_...`. Keys in URLs are refused. Test keys (`psk_test_...`) validate and
    record requests exactly like live keys but never send.

    Every error uses one envelope: `{"error": {"code", "message", "fields"?, "request_id"}}`. Codes are stable;
    messages may change. Every response carries `X-Request-Id`.

    A `202` from `POST /emails` means queued. Read the status, or subscribe to webhooks, to learn what happened.
    "accepted" means the provider took the message; only "delivered" confirms delivery.

    Every key belongs to one client and only ever sees that client's data. Prospects, campaigns and conversations
    need their own scopes (`prospects:read`, `prospects:write`, `campaigns:read`, `campaigns:write`,
    `conversations:read`); a write scope includes the matching read scope. Lists are cursor-paginated: pass the
    `next_cursor` from `meta` / `links` as `cursor`.

    Outgoing webhooks (configured under Infrastructure > Webhooks) are signed the Standard Webhooks way: verify
    `webhook-signature` (`v1,` + base64 HMAC-SHA256 of `{webhook-id}.{webhook-timestamp}.{body}` with the base64 part
    of your `whsec_` secret). Event types: prospect.created, prospect.imported, prospect.stage_changed,
    prospect.unsubscribed, campaign.started, campaign.completed, email.sent, email.opened, email.clicked,
    email.replied, email.bounced. Use `webhook-id` to ignore a delivery you already processed.
servers:
  - url: "{baseUrl}/api/v1"
    variables:
      baseUrl:
        default: https://prosend.example.com
security:
  - apiKey: []
paths:
  /me:
    get:
      summary: Describe the calling API key
      operationId: getMe
      responses:
        "200":
          description: The key's settings and remaining allowance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ApiKeyInfo" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /emails:
    post:
      summary: Send an email
      description: |
        Queues one message per recipient (1 to 50). Requires scope `emails:send`; marketing email also needs
        `emails:send_marketing`. The From address must be a sender identity allowed for the key. Suppressed
        recipients, and recipients without consent for marketing, are refused with `recipient_not_eligible`.
        The key's daily send limit counts every To, CC and BCC address.
      operationId: sendEmail
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendEmailRequest" }
            example:
              from: billing@acme.test
              to: [{ email: jane@example.com, name: Jane Doe }]
              purpose: transactional
              template_id: 12
              variables: { order_number: "1042", action_url: "https://acme.test/orders/1042" }
              tags: [receipt]
              metadata: { order_id: "1042" }
      responses:
        "202":
          description: Queued. With a test key, `status` is `simulated` and nothing is sent.
          headers:
            Idempotent-Replayed:
              description: "`true` when this is the stored response of an earlier request with the same Idempotency-Key"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        to: { type: string, format: email }
                        status: { type: string, examples: [queued, simulated] }
                  meta:
                    allOf:
                      - $ref: "#/components/schemas/Meta"
                      - type: object
                        properties:
                          idempotent_replay: { type: boolean }
                          test_mode: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      summary: List emails
      description: Emails sent by this key, newest first. With scope `emails:read_all`, every email. Cursor-paginated.
      operationId: listEmails
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/EmailStatus" } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string, format: email } }
        - { name: created_after, in: query, schema: { type: string, format: date-time } }
        - { name: created_before, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of emails
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Email" } }
                  meta:
                    type: object
                    properties:
                      next_cursor: { type: [string, "null"] }
                      prev_cursor: { type: [string, "null"] }
                      per_page: { type: integer }
                      request_id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /emails/{id}:
    get:
      summary: Get an email's status
      operationId: getEmail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The email
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Email" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /emails/{id}/events:
    get:
      summary: Get an email's event history
      operationId: listEmailEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Events, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/EmailEvent" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /prospects:
    get:
      summary: List prospects
      operationId: listProspects
      description: Requires `prospects:read`.
      parameters:
        - { name: email, in: query, schema: { type: string, format: email } }
        - { name: stage, in: query, schema: { $ref: "#/components/schemas/ProspectStage" } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: list_id, in: query, schema: { type: integer } }
        - { name: updated_after, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Prospects, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Prospect" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      summary: Create or update a prospect by email
      operationId: upsertProspect
      description: |
        Requires `prospects:write`. Only the fields sent change; tags and custom attributes are added to what the
        prospect has. Granting consent needs `consent_source`. It never removes an unsubscribe or a suppression.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertProspectRequest" }
      responses:
        "200": { description: An existing prospect was updated. }
        "201": { description: The prospect was created. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /prospects/{id}:
    get:
      summary: Read a prospect
      operationId: getProspect
      description: Requires `prospects:read`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The prospect. }
        "404": { $ref: "#/components/responses/NotFound" }
  /prospects/{id}/unsubscribe:
    post:
      summary: Record an unsubscribe
      operationId: unsubscribeProspect
      description: Requires `prospects:write`. Adds the address to the client's suppression list. Cannot be undone through the API.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The prospect, now unsubscribed. }
        "404": { $ref: "#/components/responses/NotFound" }
  /campaigns:
    get:
      summary: List campaigns
      operationId: listCampaigns
      description: Requires `campaigns:read`.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, pending_approval, scheduled, queued, sending, paused, completed, partially_failed, failed, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Campaigns, newest first. }
  /campaigns/{id}:
    get:
      summary: Read a campaign and its prospects' progress
      operationId: getCampaign
      description: Requires `campaigns:read`. `prospects` counts prospects by sequence status (active, completed, replied, bounced, unsubscribed, failed, stopped).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The campaign. }
        "404": { $ref: "#/components/responses/NotFound" }
  /campaigns/{id}/prospects:
    post:
      summary: Add prospects to a draft campaign
      operationId: addCampaignProspects
      description: |
        Requires `campaigns:write`. Only for a draft campaign sent to selected prospects; submitting, approving and
        sending stay in the panel. Unknown ids and emails are ignored; `meta.added` says how many were found.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prospect_ids: { type: array, maxItems: 1000, items: { type: integer } }
                emails: { type: array, maxItems: 1000, items: { type: string, format: email } }
      responses:
        "200": { description: The campaign. }
        "422": { description: "`campaign_not_editable`: not a draft sent to selected prospects." }
  /conversations:
    get:
      summary: List inbox conversations
      operationId: listConversations
      description: Requires `conversations:read`.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [new, open, interested, not_interested, follow_up, converted, closed] } }
        - { name: updated_after, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Conversations, newest first. }
  /conversations/{id}:
    get:
      summary: Read a conversation with its messages
      operationId: getConversation
      description: Requires `conversations:read`. Messages carry their plain text; attachments are listed by name and size.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: The conversation. }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "ProSend API key: psk_live_<12 characters>_<40 characters>, or psk_test_..."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        1 to 255 characters, unique per logical request, compared exactly (case matters). Retrying with the same
        key and body returns the original response without sending again, for 24 hours. The same key with a
        different body returns 422 `idempotency_key_reused`; while the first request is running, 409
        `idempotency_in_progress`. Only successful responses are replayed: after a 4xx, fix the cause and retry
        with the same key. After a 5xx, retry the same request; anything it already created is returned.
      schema: { type: string, minLength: 1, maxLength: 255 }
  schemas:
    ProspectStage:
      type: string
      enum: [new, active, contacted, replied, interested, converted]
    Prospect:
      type: object
      properties:
        id: { type: integer }
        object: { type: string, const: prospect }
        email: { type: string, format: email }
        first_name: { type: [string, "null"] }
        last_name: { type: [string, "null"] }
        company: { type: [string, "null"] }
        job_title: { type: [string, "null"] }
        industry: { type: [string, "null"] }
        website: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        timezone: { type: [string, "null"] }
        stage: { $ref: "#/components/schemas/ProspectStage" }
        tags: { type: array, items: { type: string } }
        custom_attributes: { type: object }
        consent:
          type: object
          properties:
            status: { type: string, enum: [granted, unknown, revoked] }
            source: { type: [string, "null"] }
            given_at: { type: [string, "null"], format: date-time }
        unsubscribed_at: { type: [string, "null"], format: date-time }
        last_contacted_at: { type: [string, "null"], format: date-time }
        last_replied_at: { type: [string, "null"], format: date-time }
        list_ids: { type: array, items: { type: integer } }
    UpsertProspectRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        company: { type: string }
        job_title: { type: string }
        industry: { type: string }
        website: { type: string, format: uri }
        phone: { type: string }
        timezone: { type: string, description: An IANA time zone, such as Asia/Kolkata. }
        notes: { type: string }
        stage: { $ref: "#/components/schemas/ProspectStage" }
        tags: { type: array, maxItems: 50, items: { type: string } }
        custom_attributes: { type: object, description: "Keys: lower-case letters, digits and underscores." }
        consent_status: { type: string, enum: [granted, unknown, revoked] }
        consent_source: { type: string, description: Required when consent_status is granted. }
        list_ids: { type: array, items: { type: integer } }
    Meta:
      type: object
      properties:
        request_id: { type: string, examples: [req_01jd9m5q8z...] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples:
                - missing_api_key
                - invalid_api_key
                - revoked_api_key
                - expired_api_key
                - key_in_url
                - ip_not_allowed
                - missing_scope
                - sender_not_allowed
                - recipient_not_eligible
                - template_not_available
                - template_variables_missing
                - validation_failed
                - idempotency_key_reused
                - idempotency_in_progress
                - invalid_idempotency_key
                - daily_send_limit_reached
                - rate_limited
                - too_many_failed_attempts
                - invalid_json
                - payload_too_large
                - not_found
                - unauthenticated
                - forbidden
                - http_error
                - server_error
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: array, items: { type: string } }
            request_id: { type: string }
    SendEmailRequest:
      type: object
      required: [from, to, purpose]
      properties:
        from: { type: string, format: email, description: An allowed sender identity }
        to:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [email]
            properties:
              email: { type: string, format: email }
              name: { type: string, maxLength: 255 }
        cc: { type: array, maxItems: 10, items: { type: string, format: email }, description: Only with exactly one `to` }
        bcc: { type: array, maxItems: 10, items: { type: string, format: email }, description: Only with exactly one `to` }
        reply_to: { type: string, format: email }
        purpose: { type: string, enum: [transactional, marketing] }
        template_id: { type: integer, description: An active template of the same purpose. Replaces subject/html/text when they are omitted. }
        subject: { type: string, maxLength: 255, description: Required without template_id }
        html: { type: string, description: Required without template_id. Sanitised before sending. }
        text: { type: string, description: Plain-text version; generated from the HTML when omitted }
        variables:
          type: object
          maxProperties: 50
          description: Values for {{ name }} placeholders in this send only. Names use lowercase letters, numbers and underscores. Values are escaped.
          additionalProperties: { type: [string, number, boolean] }
        tags: { type: array, maxItems: 10, items: { type: string, pattern: "^[a-z0-9_-]{1,50}$" } }
        metadata:
          type: object
          maxProperties: 20
          description: Returned in status responses and webhooks. Values are stored as strings.
          additionalProperties: { type: [string, number, boolean] }
        scheduled_at: { type: string, format: date-time, description: Up to 30 days ahead }
        attachments:
          type: array
          maxItems: 5
          items:
            type: object
            required: [filename, content, content_type]
            properties:
              filename: { type: string }
              content: { type: string, contentEncoding: base64, description: "Checked against content_type: a file whose content is another type is refused. The name the recipient sees always ends in an extension of content_type." }
              content_type:
                type: string
                enum: [application/pdf, image/png, image/jpeg, image/gif, text/plain, text/csv, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
    EmailStatus:
      type: string
      description: "`accepted` means the provider took the email, not that it was delivered; only `delivered` confirms delivery. `captured` means a sandbox provider (Mailtrap Email Sandbox) kept the email for inspection and it was never delivered. `simulated` means a test API key was used and nothing was sent."
      enum: [queued, deferred, sending, unknown, accepted, soft_bounced, delivered, failed, bounced, complained, suppressed, cancelled, simulated, captured]
    Email:
      type: object
      properties:
        id: { type: string, format: uuid }
        object: { type: string, const: email }
        from: { type: string, format: email }
        to: { type: object, properties: { email: { type: string }, name: { type: [string, "null"] } } }
        cc: { type: array, items: { type: string } }
        bcc: { type: array, items: { type: string } }
        subject: { type: string }
        purpose: { type: string, enum: [transactional, marketing] }
        source: { type: string, enum: [compose, campaign, api, test] }
        status: { $ref: "#/components/schemas/EmailStatus" }
        status_description: { type: string }
        template_id: { type: [integer, "null"] }
        campaign_id: { type: [integer, "null"] }
        tags: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: { type: string } }
        attempts: { type: integer }
        error:
          type: [object, "null"]
          properties:
            code: { type: [string, "null"] }
            message: { type: string }
            retryable: { type: boolean }
        scheduled_at: { type: [string, "null"], format: date-time }
        queued_at: { type: [string, "null"], format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        failed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    EmailEvent:
      type: object
      properties:
        id: { type: integer }
        object: { type: string, const: email_event }
        type: { type: string, examples: [queued, accepted, delivered, bounced, complained, unsubscribed, opened, clicked, failed] }
        source: { type: string, enum: [application, brevo_webhook, recipient] }
        recipient: { type: [string, "null"] }
        details: { type: object }
        occurred_at: { type: string, format: date-time }
    ApiKeyInfo:
      type: object
      properties:
        object: { type: string, const: api_key }
        name: { type: string }
        key: { type: string, description: Masked, for example psk_live_Ab12Cd34Ef56_…wxyz }
        mode: { type: string, enum: [live, test] }
        scopes: { type: array, items: { type: string, enum: ["emails:send", "emails:send_marketing", "emails:read", "emails:read_all", "prospects:read", "prospects:write", "campaigns:read", "campaigns:write", "conversations:read"] }, description: "Test keys never get prospects:write or campaigns:write, because those changes are real." }
        allowed_senders: { type: array, items: { type: string, format: email } }
        rate_limit_per_minute: { type: integer }
        daily_send_limit: { type: [integer, "null"] }
        emails_queued_today: { type: integer }
        daily_sends_remaining: { type: [integer, "null"] }
        expires_at: { type: [string, "null"], format: date-time }
  responses:
    BadRequest:
      description: Malformed JSON or an invalid Idempotency-Key header
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing, invalid, expired or revoked key, or a key in the URL
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Missing scope, sender not allowed, or IP not allowed
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found, or not visible to this key
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: A request with this Idempotency-Key is still running; retry after `Retry-After` seconds
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PayloadTooLarge:
      description: Body larger than 10 MB
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unprocessable:
      description: Validation failed, or a business rule refused the send
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Per-minute or daily limit reached; see `Retry-After`
      headers:
        Retry-After: { schema: { type: integer } }
        X-RateLimit-Limit: { schema: { type: integer } }
        X-RateLimit-Remaining: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
